<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate theme-cor">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claudionoid">
<title>Claudionoid</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Before first paint: apply the saved style and language (avoids a flash of the wrong theme,
  // and tells the browser the page language so it doesn't offer to translate it).
  // Keep the language logic in sync with initialLang() in src/i18n/index.jsx.
  (function () {
    var de = document.documentElement;
    var s = localStorage.getItem('claudio_style');
    if (s !== 'noir' && s !== 'papel' && s !== 'cor' && s !== 'vidro') s = 'cor';
    de.className = 'notranslate theme-' + s;
    var ok = ['en', 'pt', 'es', 'fr'];
    var l = localStorage.getItem('claudio_lang');
    if (ok.indexOf(l) < 0) {
      l = 'en';
      var prefs = navigator.languages || [navigator.language || ''];
      for (var i = 0; i < prefs.length; i++) {
        var c = String(prefs[i]).slice(0, 2).toLowerCase();
        if (ok.indexOf(c) >= 0) { l = c; break; }
      }
    }
    de.lang = l;
    var m = document.querySelector('meta[http-equiv="Content-Language"]');
    if (m) m.setAttribute('content', l);
  })();
</script>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
